name: Crypto Scanner

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Bale Chat ID"
        required: true
        type: string

jobs:
  run-scanner:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Show Chat ID
        run: |
          echo Chat ID: ${{ github.event.inputs.chat_id }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scanner
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          python run.py