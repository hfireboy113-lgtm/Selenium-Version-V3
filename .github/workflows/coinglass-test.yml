name: CoinGlass Selenium Test

on:
  push:
    branches: [coinglass-selenium-test]
  workflow_dispatch:

jobs:
  test-coinglass:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Selenium
        run: python -m pip install --upgrade pip selenium

      - name: Run CoinGlass Selenium test
        run: python coinglass_test.py
