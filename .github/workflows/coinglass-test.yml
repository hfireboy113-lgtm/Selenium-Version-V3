name: CoinGlass Selenium Test

on:
  push:
    branches: [coinglass-selenium-test]
  workflow_dispatch:

jobs:
  test-coinglass:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Selenium
        run: python -m pip install --upgrade pip selenium

      - name: Run CoinGlass Selenium extraction
        run: python coinglass_test.py

      - name: Upload CoinGlass data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinglass-extraction
          path: |
            coinglass_coins.json
            coinglass_*.html
            coinglass_*.png
          if-no-files-found: ignore
